name: HeyGen · gerar vídeo pela API
# Usa o crédito da API do HeyGen (secret HEYGEN_API_KEY). A chave nunca aparece no log.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Arquivo do pedido em scripts/heygen/ (ex.: bom-demais.json)"
        required: true
        default: bom-demais.json
      so_conferir:
        description: "true = só confere a chave e o saldo, sem gerar"
        required: false
        default: "false"
jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Conferir chave e saldo
        env:
          K: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          test -n "$K" || { echo "::error::Falta o secret HEYGEN_API_KEY"; exit 1; }
          curl -sS -H "x-api-key: $K" https://api.heygen.com/v3/users/me | jq 'del(.data.email)' | tee quota.json
          echo
      - name: Gerar e baixar
        if: ${{ inputs.so_conferir != 'true' }}
        env:
          K: ${{ secrets.HEYGEN_API_KEY }}
        run: |
          set -e
          R=$(curl -sS -X POST https://api.heygen.com/v3/videos -H "x-api-key: $K" -H "Content-Type: application/json" -H "Idempotency-Key: run-${{ github.run_id }}" --data @scripts/heygen/${{ inputs.job }})
          echo "$R"
          ID=$(echo "$R" | jq -r '.data.video_id // empty')
          test -n "$ID" || { echo "::error::HeyGen recusou o pedido"; exit 1; }
          for i in $(seq 1 120); do
            S=$(curl -sS -H "x-api-key: $K" "https://api.heygen.com/v3/videos/$ID")
            ST=$(echo "$S" | jq -r '.data.status')
            echo "$i $ST"
            if [ "$ST" = "completed" ]; then
              echo "$S" | jq '.data | del(.video_url, .thumbnail_url, .caption_url)'
              U=$(echo "$S" | jq -r '.data.video_url // .data.url // empty')
              EXT=$(jq -r '.output_format // "mp4"' scripts/heygen/${{ inputs.job }})
              curl -sSL -o video.$EXT "$U"; break
            fi
            if [ "$ST" = "failed" ]; then echo "$S"; exit 1; fi
            if [ "$i" = "1" ]; then echo "$S" | jq '.data | del(.video_url)'; fi
            sleep 20
          done
          ls -la video.*
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.so_conferir != 'true' }}
        with:
          name: heygen-${{ github.run_id }}
          path: video.*

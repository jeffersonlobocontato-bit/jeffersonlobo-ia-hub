name: Trigger rebuild on new blog post

# Disparado pelo Supabase (trigger em public.blog_posts, ver
# supabase/migrations/*_auto_rebuild_on_publish.sql) sempre que um post é
# inserido/atualizado com status = 'published'. Também pode ser disparado
# manualmente pelo botão "Run workflow" no GitHub.
#
# O que faz: cria um commit vazio em main e empurra. A Lovable detecta o
# push e publica um novo deploy, que regenera public/noticia/{slug}.html
# (com as tags OG que LinkedIn/WhatsApp leem) para qualquer post publicado
# direto no banco, sem passar por um build manual.
on:
  repository_dispatch:
    types: [blog-post-published]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  empty-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Disparar rebuild (commit vazio)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Disparar rebuild automático (novo post publicado)"
          git push origin main

name: HeyGen · procurar voz
on:
  workflow_dispatch:
    inputs:
      nome:
        description: "Parte do nome da voz"
        required: true
jobs:
  procurar:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.HEYGEN_API_KEY }}
          N: ${{ inputs.nome }}
        run: |
          for u in https://api.heygen.com/v2/voices "https://api.heygen.com/v3/voices?type=public&limit=100"; do
            curl -sS -H "x-api-key: $K" "$u" > v.json
            jq -c --arg n "$N" '[(.data.voices // .data // .data.items // [])[] | select((.name // "") | ascii_downcase | contains($n | ascii_downcase)) | {voice_id, name, language, gender}]' v.json || head -c 300 v.json
          done
